<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicle 24/7 - Live Global News</title>
    <style>
        :root {
            --bg-main: #0a0e17;
            --bg-card: #131b2e;
            --bg-card-hover: #182239;
            --card-border: #1e2d4a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --color-red: #ef4444;
            --color-skyblue: #38bdf8;
            --color-purple: #a855f7;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0a0e17 75%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid var(--card-border);
            background: rgba(10, 14, 23, 0.8);
            backdrop-filter: blur(10px);
        }

        header h1 {
            margin: 0;
            font-size: 2.8rem;
            background: linear-gradient(to right, var(--color-red), var(--color-purple), var(--color-skyblue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        header p {
            margin: 8px 0 0;
            color: var(--color-skyblue);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .search-bar-container {
            margin-bottom: 25px;
        }

        .search-input {
            width: 100%;
            padding: 16px 22px;
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }

        .search-input:focus {
            border-color: var(--color-skyblue);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            position: sticky;
            top: 20px;
        }

        .sidebar-widget {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .sidebar-widget h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--color-purple);
        }

        .news-feed h2 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            border-left: 4px solid var(--color-red);
            padding-left: 12px;
            margin-top: 0;
        }

        .news-card {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--color-skyblue);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 22px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
        }

        .news-card:hover {
            transform: translateY(-3px);
            background: var(--bg-card-hover);
            border-color: var(--color-purple);
            border-left-color: var(--color-red);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.2);
        }

        .news-card h3 {
            margin-top: 0;
            font-size: 1.35rem;
            color: #ffffff;
            line-height: 1.35;
        }

        .news-meta-info {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .news-tag {
            font-size: 0.75rem;
            color: #ffffff;
            background: var(--color-purple);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .news-date, .read-time {
            font-size: 0.78rem;
            color: var(--color-skyblue);
            background: rgba(56, 189, 248, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            font-weight: 600;
        }

        .news-content {
            line-height: 1.6;
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-bottom: 18px;
        }

        .card-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .smartlink-btn {
            background: linear-gradient(135deg, var(--color-purple), var(--color-skyblue));
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .share-btn {
            background: rgba(56, 189, 248, 0.12);
            color: var(--color-skyblue);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 9px 16px;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>Chronicle 24/7</h1>
        <p>Live Interactive Global News Stream</p>
    </header>

    <div class="container">
        <div class="search-bar-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search live news headlines..." oninput="filterNews()">
        </div>

        <div class="main-layout">
            <div class="news-feed">
                <h2>Live Trending Feed</h2>
                <div id="newsContainer"></div>
            </div>

            <aside class="sidebar">
                <div class="sidebar-widget">
                    <h3>⚡ Live Updates</h3>
                    <p style="font-size: 0.9rem; color: var(--text-muted); margin: 0;">Updated every few minutes with fresh breaking coverage worldwide.</p>
                </div>
            </aside>
        </div>
    </div>

    <script>
        const articles = [
            { id: 1, tag: "Tech & AI", title: "Next-Gen Quantum AI Chip Breakthrough Announced", time: "10 mins ago", read: "2 min read", content: "Engineers have successfully demonstrated a scalable quantum computing architecture.", smartlink: "#" },
            { id: 2, tag: "Crypto", title: "Bitcoin Surges Past Key Resistance Level", time: "25 mins ago", read: "3 min read", content: "Global digital asset markets saw an explosive surge following new ETF updates.", smartlink: "#" },
            { id: 3, tag: "Space", title: "NASA Captures High-Definition Images of Distant Planet", time: "40 mins ago", read: "4 min read", content: "Deep space observation telemetry returned unbelievable clarity of distant systems.", smartlink: "#" },
            { id: 4, tag: "Economy", title: "Central Banks Adjust Interest Rates Globally", time: "1 hour ago", read: "3 min read", content: "Policy makers released statements outlining measures to stabilize inflation.", smartlink: "#" },
            { id: 5, tag: "EV Tech", title: "Solid-State Battery Promises 1,000 KM EV Range", time: "1.5 hours ago", read: "2 min read", content: "Researchers revealed production timelines for high-density solid state batteries.", smartlink: "#" },
            { id: 6, tag: "Cybersecurity", title: "Zero-Day Vulnerability Discovered in IoT Devices", time: "2 hours ago", read: "3 min read", content: "Security researchers urge immediate firmware updates for connected smart home hubs.", smartlink: "#" },
            { id: 7, tag: "Health", title: "Gene Therapy Trial Reverses Inherited Vision Loss", time: "2.5 hours ago", read: "4 min read", content: "Medical science hits a crucial milestone after target patient trials succeeded.", smartlink: "#" },
            { id: 8, tag: "Clean Energy", title: "World's Largest Floating Solar Farm Starts Generating Power", time: "3 hours ago", read: "2 min read", content: "Designed to withstand severe weather, the installation supplies clean electricity.", smartlink: "#" },
            { id: 9, tag: "Gaming", title: "Global E-Sports Event Draws 100 Million Viewers", time: "3.5 hours ago", read: "2 min read", content: "Competitive gaming solidifies its place as mainstream global entertainment.", smartlink: "#" },
            { id: 10, tag: "Hardware", title: "Holographic Smart Glasses Aim to Replace Phones", time: "4 hours ago", read: "3 min read", content: "Lightweight spatial computing glasses shift user habits away from traditional screens.", smartlink: "#" },
            { id: 11, tag: "Mobile", title: "Dual-Folding Screen Device Launched Worldwide", time: "4.5 hours ago", read: "2 min read", content: "Featuring a tri-fold design expanding into a 10-inch OLED tablet.", smartlink: "#" },
            { id: 12, tag: "AI", title: "Autonomous AI Agents Complete First Software Cycle", time: "5 hours ago", read: "4 min read", content: "Software engineering protocols reach new speed milestones with agent frameworks.", smartlink: "#" },
            { id: 13, tag: "Aviation", title: "Commercial Supersonic Jet Completes Test Flight", time: "5.5 hours ago", read: "3 min read", content: "Halving flight durations over oceanic routes using sustainable fuel.", smartlink: "#" },
            { id: 14, tag: "Entertainment", title: "Streaming Giant Signs Record $2 Billion Studio Deal", time: "6 hours ago", read: "2 min read", content: "Content creation moves into high gear with interactive cinematic experiences.", smartlink: "#" },
            { id: 15, tag: "Climate", title: "New Direct Air Carbon Capture Plant Opens", time: "6.5 hours ago", read: "3 min read", content: "Utilizing deep underground basalt mineralization to absorb ambient CO2.", smartlink: "#" },
            { id: 16, tag: "Fintech", title: "Cross-Border Instant Digital Payment Rail Launched", time: "7 hours ago", read: "2 min read", content: "Merchants can now transact seamlessly across borders using instant QR code settlements.", smartlink: "#" },
            { id: 17, tag: "Robotics", title: "Humanoid Robots Deployed in Logistics Hubs", time: "7.5 hours ago", read: "3 min read", content: "Tactile feedback sensors allow bipedal robots to handle parcel sorting.", smartlink: "#" },
            { id: 18, tag: "E-Commerce", title: "Drone Delivery Coverage Expands to 50 New Cities", time: "8 hours ago", read: "2 min read", content: "Suburban households receive essential goods via rapid drone drops.", smartlink: "#" },
            { id: 19, tag: "Neurotech", title: "Brain Interface Allows Typing 80 Words Per Minute", time: "8.5 hours ago", read: "4 min read", content: "Sensors read neural signals empowering individuals to control screens seamlessly.", smartlink: "#" },
            { id: 20, tag: "Web Tech", title: "New Web Engine Standard Speeds Up Browsing By 300%", time: "9 hours ago", read: "2 min read", content: "Lightweight engine protocols reduce RAM usage while boosting rendering speeds.", smartlink: "#" }
        ];

        function renderArticles(data) {
            const container = document.getElementById('newsContainer');
            container.innerHTML = '';
            data.forEach(article => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <div class="news-meta-info">
                        <span class="news-tag">${article.tag}</span>
                        <span class="news-date">📅 ${article.time}</span>
                        <span class="read-time">⏱️ ${article.read}</span>
                    </div>
                    <h3>${article.title}</h3>
                    <div class="news-content">${article.content}</div>
                    <div class="card-actions">
                        <a href="${article.smartlink}" target="_blank" class="smartlink-btn">
                            <span>🔥 Read Full Story</span> ➔
                        </a>
                        <button class="share-btn" onclick="alert('Link Copied!')">🔗 Share</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterNews() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = articles.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.tag.toLowerCase().includes(query)
            );
            renderArticles(filtered);
        }

        // Automatic execution on page load
        document.addEventListener('DOMContentLoaded', () => {
            renderArticles(articles);
        });
    </script>
</body>
</html>
