<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicle 24/7 - Live Global News</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            /* Premium Midnight Navy Palette */
            --bg-main: #0a0e17;
            --bg-card: #131b2e;
            --bg-card-hover: #182239;
            --card-border: #1e2d4a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            
            /* Custom Accent Colors */
            --color-red: #ef4444;
            --color-skyblue: #38bdf8;
            --color-purple: #a855f7;
            --color-purple-hover: #9333ea;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0a0e17 75%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid var(--card-border);
            background: rgba(10, 14, 23, 0.8);
            backdrop-filter: blur(10px);
        }

        header h1 {
            margin: 0;
            font-size: 2.8rem;
            background: linear-gradient(to right, var(--color-red), var(--color-purple), var(--color-skyblue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        header p {
            margin: 8px 0 0;
            color: var(--color-skyblue);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .search-bar-container {
            margin-bottom: 25px;
        }

        .search-input {
            width: 100%;
            padding: 16px 22px;
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-input:focus {
            border-color: var(--color-skyblue);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            position: sticky;
            top: 20px;
        }

        .sidebar-widget {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .sidebar-widget h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--color-purple);
            margin-bottom: 10px;
        }

        .news-feed h2 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            border-left: 4px solid var(--color-red);
            padding-left: 12px;
            margin-top: 0;
        }

        /* News Card Styling */
        .news-card {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--color-skyblue);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 22px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            position: relative;
        }

        .news-card:hover {
            transform: translateY(-3px);
            background: var(--bg-card-hover);
            border-color: var(--color-purple);
            border-left-color: var(--color-red);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.2);
        }

        .news-card h3 {
            margin-top: 0;
            font-size: 1.35rem;
            color: #ffffff;
            line-height: 1.35;
        }

        .news-meta-info {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .news-tag {
            font-size: 0.75rem;
            color: #ffffff;
            background: var(--color-purple);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .news-date, .read-time {
            font-size: 0.78rem;
            color: var(--color-skyblue);
            background: rgba(56, 189, 248, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            font-weight: 600;
        }

        .news-content {
            line-height: 1.6;
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-bottom: 18px;
        }

        .card-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* SmartLink CTA Button Style */
        .smartlink-btn {
            background: linear-gradient(135deg, var(--color-purple), var(--color-skyblue));
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s, transform 0.2s;
        }

        .smartlink-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .share-btn {
            background: rgba(56, 189, 248, 0.12);
            color: var(--color-skyblue);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 9px 16px;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .share-btn:hover {
            background: var(--color-skyblue);
            color: #0a0e17;
        }

        #toastContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--success);
        }
    </style>
</head>
<body>

            </div>

            <aside class="sidebar">

                </div>
                <div class="sidebar-widget">
                    <h3>🔥 Popular Categories</h3>
                    <p style="font-size: 0.85rem; color: var(--color-skyblue);">Tech • AI • Markets • Science • Sports • Entertainment</p>

            </aside>

        </div>

            {

                title: "Next Generation Web Framework Standard Speeds Up Internet Browsing By 300%",
                time: "9 hours ago",

                content: "Browsers globally implement lightweight engine protocols reducing RAM footprint drastically while increasing rendering speeds on mobile and desktop devices.",

        let currentArticles = [...articles];

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span>✅</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function renderArticles(data) {
            const container = document.getElementById('newsContainer');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:40px;">No articles found matching your search.</div>';
                return;
            }

            data.forEach(article => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <div class="news-meta-info">
                        <span class="news-tag">${article.tag}</span>
                        <span class="news-date">📅 ${article.time}</span>
                        <span class="read-time">⏱️ ${article.read}</span>
                    </div>
                    <h3>${article.title}</h3>
                    <div class="news-content">${article.content}</div>
                    <div class="card-actions">
                        <a href="${article.smartlink}" target="_blank" class="smartlink-btn">
                            <span>🔥 Read Full Story</span>
                            <span>➔</span>
                        </a>
                        <button class="share-btn" onclick="shareArticle('${article.title.replace(/'/g, "\\'")}')">🔗 Share</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterNews() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = articles.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.content.toLowerCase().includes(query) ||
                item.tag.toLowerCase().includes(query)
            );
            renderArticles(filtered);
        }

        function shareArticle(title) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(window.location.href);
                showToast(`Link copied for article!`);
            }
        }

        // Initial Load
        renderArticles(articles);

</html>
